# File name template: /logs/HOST/PROGRAM/2025-11-05.log
template(name="PerProgramDailyFile" type="string"
         string="/logs/%HOSTNAME%/%programname%/%$YEAR%-%$MONTH%-%$DAY%.log")

# Message line format (RFC3339 time + host + tag + msg)
template(name="LineFormat" type="string"
         string="%timereported:::date-rfc3339% %HOSTNAME% %syslogtag%%msg%\n")

# Write everything we receive into per-program daily files
*.* action(type="omfile" DynaFile="PerProgramDailyFile" template="LineFormat")