[global]
   workgroup = ${SMB_WORKGROUP}
   server role = standalone server
   netbios name = SIMPLE-SMB
   security = user
   map to guest = never
   # Only modern protocols
   client min protocol = SMB2
   server min protocol = SMB2
   # Keep logs in stdout if possible
   logging = syslog@0 file
   log level = 1

   # Performance-friendly defaults for labs
   load printers = no
   printing = bsd
   disable spoolss = yes

# Share is injected at runtime by env vars.
# We define a template section and entrypoint will write final share block.
# (Kept for reference)